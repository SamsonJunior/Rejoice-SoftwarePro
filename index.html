<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PharmaVerify · Drug Verification &amp; Pharmacy Management</title>
<style>
:root{--bg:#f3f6f8;--card:#fff;--ink:#1e293b;--mut:#64748b;--line:#e2e8f0;--brand:#0f766e;--b2:#14b8a6;--ok:#15803d;--okb:#dcfce7;--wa:#b45309;--wab:#fef3c7;--er:#b91c1c;--erb:#fee2e2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1218;--card:#121c25;--ink:#e2e8f0;--mut:#94a3b8;--line:#223140;--ok:#4ade80;--okb:#0f3a24;--wa:#fbbf24;--wab:#3b2e0b;--er:#f87171;--erb:#3f1212;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:flex;min-height:100vh}.side{width:236px;flex:none;background:linear-gradient(180deg,#0b1f2a,#0d3b3f);color:#cbd5e1;display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;color:#fff;font:700 18px system-ui;padding:4px 10px 18px}.brand svg{stroke:#2dd4bf}
.nav{flex:1;display:flex;flex-direction:column;gap:2px;overflow:auto}.nav a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:9px;color:#cbd5e1;cursor:pointer}.nav a:hover{background:rgba(255,255,255,.08)}.nav a.on{background:var(--brand);color:#fff}

.who{border-top:1px solid rgba(255,255,255,.12);padding-top:12px;display:flex;gap:10px;align-items:center;color:#e2e8f0}.who a{color:#94a3b8;cursor:pointer}
.av{width:34px;height:34px;border-radius:50%;background:var(--b2);color:#052e2b;display:grid;place-items:center;font-weight:700;flex:none}
main{flex:1;min-width:0;padding:22px 28px 48px}h1{font-size:22px;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(15,23,42,.05)}.card h3{margin:0 0 12px;font-size:15px}
.g{display:grid;gap:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}.g+.g,.card+.card{margin-top:16px}
.stat{display:flex;gap:14px;align-items:center}.ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none}.stat b{font-size:22px;display:block;line-height:1.1}.stat span{color:var(--mut);font-size:12px}
table{width:100%;border-collapse:collapse}th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);text-align:left;padding:8px;border-bottom:1px solid var(--line)}td{padding:10px 8px;border-bottom:1px solid var(--line)}.tw{overflow-x:auto;margin-top:12px}
.bt{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer;font:inherit}.bt:hover{border-color:var(--b2)}.bt.p{background:var(--brand);color:#fff;border-color:var(--brand)}.bt.s{padding:4px 9px;font-size:12px}.bt.d{color:var(--er)}
input,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font:inherit}input:focus,select:focus{outline:2px solid var(--b2);border-color:transparent}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}.f{margin-bottom:12px}
.bd{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--line)}.ok{background:var(--okb);color:var(--ok)}.wa{background:var(--wab);color:var(--wa)}.er{background:var(--erb);color:var(--er)}
.bars{display:flex;gap:10px;align-items:flex-end;height:150px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut)}.bars i{display:block;background:linear-gradient(var(--b2),var(--brand));border-radius:6px 6px 0 0}
.res{text-align:center;padding:24px;border-radius:14px;margin-bottom:16px}.res h2{margin:6px 0}.res svg{width:56px;height:56px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{margin-left:auto}.mut{color:var(--mut)}code{font-size:12px}
.ov{position:fixed;inset:0;background:rgba(2,12,20,.55);display:grid;place-items:center;padding:16px;z-index:9}.box{background:var(--card);border-radius:14px;padding:22px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}.hero{background:linear-gradient(135deg,#0b1f2a,#0f766e);color:#fff;padding:64px;display:flex;flex-direction:column;justify-content:center}.hero h1{font-size:36px}.hero li{margin:10px 0;opacity:.9}
.lf{display:grid;place-items:center;padding:24px}.lf form{width:100%;max-width:360px}.toast{position:fixed;right:16px;bottom:16px;background:#0b1f2a;color:#fff;padding:10px 16px;border-radius:10px;z-index:99}
@media(max-width:900px){.app{flex-direction:column}.side{width:auto;height:auto;position:sticky;top:0;z-index:5;flex-direction:row;padding:8px;align-items:center;overflow:hidden}.nav{overflow-x:auto}.nav a{padding:10px 12px}.who{border:0;padding:0}.box{padding:16px}h1{font-size:19px}.brand{padding:0 8px}.brand span,.who div,.nav span{display:none}.nav{flex-direction:row}.login{grid-template-columns:1fr}.hero{display:none}main{padding:16px}}
@media print{#app{display:none}.ov{position:static;background:none;display:block}.noprint{display:none}}
</style></head><body><div id="app"></div><div id="modal"></div>
<script>
const $=s=>document.querySelector(s),K='pharmaverify-v2';
const td=(d=0)=>{const x=new Date();x.setDate(x.getDate()+d);return x.toLocaleDateString('en-CA')};
const uid=()=>Math.random().toString(36).slice(2,7).toUpperCase();
const money=n=>'₦'+Number(n).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
class H{constructor(s){this.s=s}}const raw=s=>new H(s),cell=v=>v instanceof H?v.s:esc(v);
const sha=async s=>{try{return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){return s}};
const IC={home:'M3 11l9-8 9 8v10H3z',scan:'M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M4 12h16',box:'M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10',cart:'M3 4h2l2 12h11l2-8H6M9 20h.01M17 20h.01',file:'M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h7',users:'M8 11a3 3 0 100-6 3 3 0 000 6zM2 20c0-3 3-5 6-5s6 2 6 5M17 11a3 3 0 100-6M18 15c2 .5 4 2 4 5',pill:'M10.5 20.5l-7-7a4.9 4.9 0 017-7l7 7a4.9 4.9 0 01-7 7zM8.5 8.5l7 7',truck:'M2 6h12v10H2zM14 9h5l3 3v4h-8M6 19a2 2 0 100-4M18 19a2 2 0 100-4',chart:'M4 20V10M10 20V4M16 20v-7M22 20H2',gear:'M12 8a4 4 0 100 8 4 4 0 000-8zM12 2v3M12 19v3M2 12h3M19 12h3',shield:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4',out:'M9 21H5V3h4M16 17l5-5-5-5M21 12H9',warn:'M12 3l10 18H2zM12 10v5M12 18h.01',user:'M12 12a4 4 0 100-8 4 4 0 000 8zM4 21c0-4 4-6 8-6s8 2 8 6',tag:'M3 12V3h9l9 9-9 9zM7.5 7.5h.01',clock:'M12 21a9 9 0 100-18 9 9 0 000 18zM12 7v5l3 2'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24"><path d="${IC[n]}"/></svg>`;
const NAV=[['dashboard','Dashboard','home'],['drugs','Drugs','pill','admin'],['verify','Verify Drug','scan'],['inventory','Inventory','box'],['rx','Prescriptions','file'],['customers','Customers','users'],['suppliers','Suppliers','truck'],['sales','Sales','cart'],['reports','Reports','chart'],['users','Users','user','admin'],['cats','Categories','tag','admin'],['logs','Verification Logs','clock','admin'],['settings','Settings','gear','admin']];
const T={dashboard:'Dashboard',verify:'Drug Verification',inventory:'Inventory',sales:'Sales',rx:'Prescriptions',customers:'Customers',drugs:'Drugs',suppliers:'Suppliers',reports:'Reports',users:'User Management',cats:'Drug Categories',logs:'Verification Logs',settings:'System Settings'};
let S,U=null,V='dashboard',cart=[],res=null,q='',rep='sales',cs='',ds=0,py='Cash',rf='',rt='';

async function seed(){
 const cats=['Analgesic','Antibiotic','Antimalarial','Supplement','Antidiabetic'].map((name,i)=>({id:'k'+(i+1),name}));
 const suppliers=[['s1','Emzor Distribution Ltd','0803 123 4567','sales@emzor.example','Lagos'],['s2','Fidson Healthcare','0805 765 4321','orders@fidson.example','Ikeja, Lagos'],['s3','May & Baker Nigeria','0809 988 7766','info@mayandbaker.example','Abuja']].map(([id,name,phone,email,addr])=>({id,name,phone,email,addr}));
 const drugs=[['d1','Paracetamol 500mg','Paracetamol','k1','Emzor','s1',350],['d2','Amoxicillin 500mg','Amoxicillin','k2','Fidson','s2',1800],['d3','Artemether/Lumefantrine','Artemether + Lumefantrine','k3','May & Baker','s3',2500],['d4','Vitamin C 1000mg','Ascorbic acid','k4','Emzor','s1',1200],['d5','Ibuprofen 400mg','Ibuprofen','k1','Fidson','s2',600],['d6','Metformin 500mg','Metformin HCl','k5','May & Baker','s3',900]].map(([id,name,gen,cid,maker,sid,price])=>({id,name,gen,cid,maker,sid,price,desc:''}));
 const inv=[['b1','d1','PCM-2601','NG-PCM-2601-0001',200,540,50],['b2','d2','AMX-2512','NG-AMX-2512-0001',60,300,30],['b3','d3','ALU-2603','NG-ALU-2603-0001',25,45,40],['b4','d4','VTC-2509','NG-VTC-2509-0001',80,420,20],['b5','d5','IBU-2411','NG-IBU-2411-0001',15,-20,30],['b6','d6','MET-2605','NG-MET-2605-0001',18,200,25]].map(([id,did,batch,code,qty,e,re])=>({id,did,batch,code,qty,exp:td(e),re}));
 const sales=[0,1,1,2,3,4,5,6].map((d,i)=>{const b=inv[i%4],g=drugs.find(x=>x.id===b.did),q=1+i%3;return{id:'INV-'+(1000+i),date:td(-d)+'T1'+i+':00',cid:'',total:q*g.price,disc:0,pay:'Cash',items:[{n:g.name,batch:b.batch,q,p:g.price}],by:'Pharmacist'}});
 const customers=[['c1','Amina Yusuf','0801 111 2222','amina@example.com','Keffi'],['c2','Chinedu Okafor','0803 333 4444','chinedu@example.com','Karu'],['c3','Grace Ibrahim','0805 555 6666','grace@example.com','Lafia']].map(([id,name,phone,email,addr])=>({id,name,phone,email,addr}));
 const users=[{id:'u1',name:'Administrator',username:'admin',role:'admin',status:'active',pw:await sha('admin123')},{id:'u2',name:'Pharmacist',username:'pharmacist',role:'pharmacist',status:'active',pw:await sha('pharm123')}];
 return{cats,suppliers,drugs,inv,sales,customers,users,rx:[],logs:[],set:{name:'PharmaVerify Pharmacy',addr:'Keffi, Nasarawa State',phone:'',email:'',soon:90,re:10}};
}
async function load(){try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S)S=await seed()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const dOf=b=>S.drugs.find(d=>d.id===b.did)||{name:'(deleted drug)',price:0};
const bOf=id=>S.inv.find(b=>b.id===id);
const bst=b=>b.exp<td()?'Expired':b.exp<=td(S.set.soon)?'Expiring soon':b.qty<=b.re?'Low stock':'OK';
const CL={Expired:'er','Expiring soon':'wa','Low stock':'wa',OK:'ok',genuine:'ok',expired:'wa',suspect:'er',pending:'wa',dispensed:'ok',active:'ok',inactive:'er'};
const LB={suspect:'Suspected counterfeit',genuine:'Genuine',expired:'Expired'};
const bd=s=>`<span class="bd ${CL[s]||''}">${esc(LB[s]||s[0].toUpperCase()+s.slice(1))}</span>`;
const sup=id=>(S.suppliers.find(s=>s.id===id)||{}).name||'—',cn=id=>(S.customers.find(c=>c.id===id)||{}).name||'Walk-in',catn=id=>(S.cats.find(c=>c.id===id)||{}).name||'—';
const toast=t=>{const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2800)};
function modal(title,body,fn,ok='Save'){const m=$('#modal');m.innerHTML=`<div class="ov"><form class="box"><h3 style="margin-top:0">${title}</h3>${body}<div class="row" style="justify-content:flex-end;margin-top:8px"><button type="button" class="bt" data-a="close">Cancel</button><button class="bt p">${ok}</button></div></form></div>`;
 m.querySelector('form').onsubmit=async ev=>{ev.preventDefault();if(await fn(Object.fromEntries(new FormData(ev.target)))!==false)m.innerHTML=''}}
const tbl=(h,rows,extra='')=>`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}${extra?'<th></th>':''}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${cell(v)}</td>`).join('')}</tr>`).join('')||`<tr><td class="mut">No records.</td></tr>`}</tbody></table></div>`;

/* ---------- CRUD entities ---------- */
const P=[['name','Full name','text',1],['phone','Phone'],['email','Email','email'],['addr','Address']];
const E={
 drugs:{k:'drugs',f:[['name','Drug name','text',1],['gen','Generic name'],['cid','Category','select',1,()=>S.cats.map(c=>[c.id,c.name])],['maker','Manufacturer'],['sid','Supplier','select',0,()=>S.suppliers.map(s=>[s.id,s.name])],['price','Unit price (₦)','number',1],['desc','Description']],h:['Drug','Generic name','Category','Supplier','Price'],r:d=>[d.name,d.gen,catn(d.cid),sup(d.sid),money(d.price)],used:d=>S.inv.some(b=>b.did===d.id)},
 suppliers:{k:'suppliers',f:P,h:['Name','Phone','Email','Address'],r:s=>[s.name,s.phone,s.email,s.addr],used:s=>S.drugs.some(d=>d.sid===s.id)},
 customers:{k:'customers',f:P,h:['Name','Phone','Email','Address'],r:c=>[c.name,c.phone,c.email,c.addr]},
 inventory:{k:'inv',f:[['did','Drug','select',1,()=>S.drugs.map(d=>[d.id,d.name])],['batch','Batch number','text',1],['code','Barcode / QR code (blank = auto-generate)'],['qty','Quantity','number',1],['exp','Expiry date','date',1],['re','Reorder level','number',1]],h:['Drug','Batch','Code','Qty','Expiry','Status'],r:b=>[dOf(b).name,b.batch,raw('<code>'+esc(b.code)+'</code>'),b.qty,b.exp,raw(bd(bst(b)))]},
 users:{k:'users',f:[['name','Full name','text',1],['username','Username','text',1],['role','Role','select',1,()=>[['pharmacist','Pharmacist'],['admin','Administrator']]],['status','Status','select',1,()=>[['active','Active'],['inactive','Inactive']]],['pw','Password (8+ characters; blank keeps current)','password',1]],h:['Name','Username','Role','Status'],r:u=>[u.name,'@'+u.username,raw(bd(u.role)),raw(bd(u.status||'active'))],used:u=>u.id===U.id},
 cats:{k:'cats',f:[['name','Category name','text',1]],h:['Category','Drugs'],r:c=>[c.name,S.drugs.filter(d=>d.cid===c.id).length],used:c=>S.drugs.some(d=>d.cid===c.id)}
};
function crud(n){const c=E[n],L=S[c.k].filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q.toLowerCase()));
 return`<div class="card"><div class="row"><input data-q placeholder="Search…" value="${esc(q)}" style="max-width:260px"><button class="bt p sp" data-a="add" data-n="${n}">+ Add new</button></div><div class="tw"><table><thead><tr>${c.h.map(h=>`<th>${h}</th>`).join('')}<th></th></tr></thead><tbody>${L.map(x=>`<tr>${c.r(x).map(v=>`<td>${cell(v)}</td>`).join('')}<td style="text-align:right;white-space:nowrap"><button class="bt s" data-a="edit" data-n="${n}" data-id="${x.id}">Edit</button> <button class="bt s d" data-a="del" data-n="${n}" data-id="${x.id}">Delete</button></td></tr>`).join('')||'<tr><td class="mut">No records.</td></tr>'}</tbody></table></div></div>`}
function form(n,id){const c=E[n],x=id?S[c.k].find(y=>y.id===id):{};
 const body=c.f.map(([k,l,t='text',r,o])=>{const v=x[k]??(k==='re'?S.set.re:k==='status'?'active':'');return`<div class="f"><label>${l}${r?' *':''}</label>${t==='select'?`<select name="${k}" ${r?'required':''}><option value="">— Select —</option>${o().map(([a,m])=>`<option value="${a}" ${v===a?'selected':''}>${esc(m)}</option>`).join('')}</select>`:`<input name="${k}" type="${t}" ${t==='number'?'min="0" step="any"':t==='password'?'minlength="8"':''} value="${t==='password'?'':esc(v)}" ${r&&!(k==='pw'&&id)?'required':''}>`}</div>`}).join('');
 modal(id?'Edit record':'Add new',body,async d=>{
  for(const k of ['price','re','qty'])if(k in d)d[k]=+d[k];
  if(n==='inventory'){d.code=(d.code||'').trim()||'PV-'+uid()+uid();if(S.inv.some(b=>b.code.toLowerCase()===d.code.toLowerCase()&&b.id!==id)){toast('That code is already registered.');return false}}
  if(n==='users'){if(S.users.some(u=>u.username===d.username&&u.id!==id)){toast('Username already exists.');return false}if(d.pw)d.pw=await sha(d.pw);else delete d.pw}
  if(id)Object.assign(x,d);else S[c.k].push({id:n[0]+uid(),...d});save();toast('Saved.');render()})}

/* ---------- views ---------- */
const rq=b=>{const s=S.suppliers.find(x=>x.id===dOf(b).sid);return s&&s.email?`<a href="mailto:${esc(s.email)}?subject=${encodeURIComponent('Reorder: '+dOf(b).name)}&body=${encodeURIComponent('Please supply '+dOf(b).name+' (batch '+b.batch+').')}" style="color:var(--brand);font-size:12px">Notify supplier</a>`:''};
const lrows=n=>S.logs.slice(0,n).map(l=>[l.code,l.bid?dOf(bOf(l.bid)||{}).name:'Unregistered',raw(bd(l.st)),l.by,l.at.replace('T',' ')]);
const VIEWS={
dashboard(){const days=[...Array(7)].map((_,i)=>td(i-6)),by=days.map(d=>S.sales.filter(s=>s.date.slice(0,10)===d).reduce((a,s)=>a+s.total,0)),mx=Math.max(...by,1);
 const wk=S.logs.filter(l=>l.st==='suspect'&&l.at.slice(0,10)>=td(-6)).length,al=S.inv.filter(b=>b.qty>0&&bst(b)!=='OK').sort((a,b)=>a.exp<b.exp?-1:1).slice(0,7);
 const st=[['Registered drugs',S.drugs.length,'pill','#ccfbf1','#0f766e'],['Units in stock',S.inv.filter(b=>b.exp>=td()).reduce((a,b)=>a+b.qty,0),'box','#dbeafe','#1d4ed8'],['Customers',S.customers.length,'users','#ede9fe','#6d28d9'],['Suppliers',S.suppliers.length,'truck','#ffedd5','#c2410c'],['Pending prescriptions',S.rx.filter(r=>r.st==='pending').length,'file','#fef9c3','#a16207'],['Today’s sales',money(S.sales.filter(s=>s.date.slice(0,10)===td()).reduce((a,s)=>a+s.total,0)),'cart','#dcfce7','#15803d'],['Verifications today',S.logs.filter(l=>l.at.slice(0,10)===td()).length,'scan','#dbeafe','#1d4ed8'],['Suspect scans (7 days)',wk,'warn','#fee2e2','#b91c1c']];
 return`<div class="g g4">${st.map(s=>`<div class="card stat"><div class="ic" style="background:${s[3]};color:${s[4]}">${ic(s[2])}</div><div><b>${s[1]}</b><span>${s[0]}</span></div></div>`).join('')}</div>
<div class="g g2"><div><div class="card"><h3>Sales, last 7 days</h3><div class="bars">${days.map((d,i)=>`<div title="${money(by[i])}"><i style="height:${Math.max(4,by[i]/mx*120)}px"></i>${new Date(d+'T12:00').toLocaleDateString('en',{weekday:'short'})}</div>`).join('')}</div></div>
<div class="card"><div class="row"><h3 style="margin:0">Recent verifications</h3><a class="sp" data-a="go" data-v="verify" style="cursor:pointer;color:var(--brand)">Verify a drug →</a></div>${tbl(['Code','Drug','Result','By','When'],lrows(5))}</div></div>
<div class="card"><h3>Stock alerts</h3>${al.map(b=>`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)"><div><b>${esc(dOf(b).name)}</b><div class="mut">Batch ${esc(b.batch)} · ${b.qty} units · exp ${b.exp}</div>${rq(b)}</div><span class="sp">${bd(bst(b))}</span></div>`).join('')||'<p class="mut">Everything looks healthy.</p>'}</div></div>`},
verify(){const s1=S.inv[0],s2=S.inv.find(b=>b.exp<td()),ch=[s1&&s1.code,s2&&s2.code,'FAKE-12345'].filter(Boolean);
 const R=res?(()=>{const{st,b,code}=res,i={genuine:'shield',expired:'clock',suspect:'warn'}[st],c={genuine:'ok',expired:'wa',suspect:'er'}[st];
